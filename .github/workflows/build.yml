name: build

# GitHub's runners have no GPU, so CI checks that every kernel compiles for
# the T4 (sm_75). Correctness and speed are checked on a real GPU (Colab).
on: [push, pull_request]

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
      - name: Compile for T4 (sm_75)
        run: make ARCH=sm_75
      - name: Check the plotting scripts parse
        run: python3 -m py_compile scripts/*.py
